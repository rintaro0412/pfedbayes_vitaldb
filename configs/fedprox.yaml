run:
  out_dir: runs/fedprox
  run_name: seed42
  resume: false

federated:
  algo: fedprox
  # FedOcw 論文の比較設定では μ∈{0.01,0.1,1.0} を探索し、μ=0.1 を採用
  fedprox_mu: 0.1

data:
  data_dir: federated_data
  train_split: train
  val_split: val
  test_split: test

train:
  rounds: 200
  local_epochs: 1
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0001
  seed: 42
  num_workers: 16
  cache_in_memory: false
  max_cache_files: 32
  cache_dtype: float32
  min_client_examples: 10
  client_progress_bar: false
  no_progress_bar: false
  val_every_round: true
  test_every_round: false
  save_round_json: true
  per_client_every_round: false

model:
  base_channels: 32
  dropout: 0.1
  use_gru: false
  gru_hidden: 64

eval:
  eval_threshold: 0.5
  model_selection: best
  selection_metric: nll
  save_test_pred_npz: test_predictions.npz
